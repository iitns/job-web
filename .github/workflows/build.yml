name: Build and Push Job Web Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "requirements.txt"
      - "app.py"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "Dockerfile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-web:latest
            ghcr.io/${{ github.repository_owner }}/job-web:${{ github.sha }}

      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: iitns/k8s-manifests
          token: ${{ secrets.K8S_MANIFESTS_PAT }}
          path: k8s-manifests

      - name: Update job-web image tag
        run: |
          sed -i "s|image: ghcr.io/iitns/job-web:.*|image: ghcr.io/iitns/job-web:${{ github.sha }}|" \
            k8s-manifests/apps/job-web/deployment.yaml
          cd k8s-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update job-web image to ${{ github.sha }}" || exit 0
          git push
